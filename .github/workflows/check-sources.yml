# 週 1 回、出典ページの変更をチェックする。
# 変更があれば data/source-status.json をコミットし（サイトに「出典が更新されました」と出る）、
# 確認作業のための Issue を立てる。
# ※ このファイルはリポジトリのルートの .github/workflows/ に置く必要がある。
name: check-sources

on:
  schedule:
    - cron: "0 0 * * 1" # 毎週月曜 9:00（日本時間）
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: check-sources
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check sources
        run: python scripts/check_sources.py --changed-list changed.txt
      - name: Commit status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-status.json
          git diff --cached --quiet || git commit -m "出典の変更チェック結果を更新"
          git push
      - name: Open issue for changed sources
        if: hashFiles('changed.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s changed.txt ]; then
            {
              echo "次の出典ページの内容が変わりました。原文を確認し、データを直したら確認日（checked）を更新してください。"
              echo
              sed 's/^/- /' changed.txt
            } > body.md
            gh issue create --title "出典の再確認が必要です（$(date -u +%Y-%m-%d)）" --body-file body.md
          fi
